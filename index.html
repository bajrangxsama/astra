<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Animations</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>🎬 My Animations & Films</h1>
    <p>Original movies and animations by me</p>
  </header>

  <main class="grid">

    <!-- Copy this card block for each movie -->
    <div class="card">
      <img src="images/poster1.jpg" alt="Movie Title Poster">
      <div class="info">
        <h2>Movie Title Here</h2>
        <p class="genre">Animation · 2024 · 12 min</p>
        <p class="synopsis">Write your synopsis here. Describe what the movie is about in 2-3 sentences.</p>
        <div class="buttons">
          <a href="YOUR_GOOGLE_DRIVE_LINK" target="_blank" class="btn watch">▶ Watch Online</a>
          <a href="YOUR_DOWNLOAD_LINK" target="_blank" class="btn download">⬇ Download</a>
        </div>
      </div>
    </div>
    <!-- End of card -->

  </main>

  <footer>
    <p>© 2024 Your Name. All Rights Reserved.</p>
  </footer>

</body>
</html>
